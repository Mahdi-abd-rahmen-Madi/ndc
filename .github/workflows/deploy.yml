name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Authenticate Tailscale
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            echo "Error: TAILSCALE_AUTHKEY secret is empty or not accessible!"
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes --timeout=30s

      - name: Deploy to VPS via SSH
        run: |
          # Use Tailscale SSH to connect and deploy
          # ssh -o StrictHostKeyChecking=no -o BatchMode=yes root@heliosys-debian-prod
          # 
          # Assuming the project is cloned at /root/ndc or we will clone it.
          # Here we just execute commands remotely.
          
          ssh -o StrictHostKeyChecking=no root@heliosys-debian-prod << 'EOF'
            set -e
            # Ensure the project directory exists
            mkdir -p /opt/ndc
            cd /opt/ndc
            
            # If not a git repo, clone it, else pull
            if [ ! -d ".git" ]; then
              git clone https://github.com/Mahdi-abd-rahmen-Madi/ndc.git .
            else
              # Force reset to master to avoid conflicts on the VPS
              git fetch --all
              git reset --hard origin/master
            fi
            
            # Clean up disk space before building
            docker builder prune -af --filter "until=24h" || true
            docker system prune -af --volumes=false || true
            rm -rf /tmp/* 2>/dev/null || true

            # Ensure bind-mounted media dir is writable by non-root backend container user (uid 1000)
            mkdir -p /opt/ndc/backend/media /opt/ndc/backend/data
            chown -R 1000:1000 /opt/ndc/backend/media || true

            # Build and deploy the Docker containers (backend + qcluster + frontend + caddy)
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Automatically apply pending migrations, PostgreSQL cache table, and static files
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py createcachetable
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
            
            # Prune unused build cache and dangling images after build
            docker system prune -f
            docker builder prune -f || true
          EOF
