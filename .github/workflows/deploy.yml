name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tailscale Setup
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Alternatively use an auth key if preferred:
          # authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to VPS via SSH
        run: |
          # Use Tailscale SSH to connect and deploy
          # ssh -o StrictHostKeyChecking=no -o BatchMode=yes root@heliosys-debian-prod
          # 
          # Assuming the project is cloned at /root/ndc or we will clone it.
          # Here we just execute commands remotely.
          
          ssh -o StrictHostKeyChecking=no root@heliosys-debian-prod << 'EOF'
            # Ensure the project directory exists
            mkdir -p /opt/ndc
            cd /opt/ndc
            
            # If not a git repo, clone it, else pull
            if [ ! -d ".git" ]; then
              git clone https://github.com/Mahdi-abd-rahmen-Madi/ndc.git .
            else
              # Force reset to master to avoid conflicts on the VPS
              git fetch --all
              git reset --hard origin/master
            fi
            
            # Build and deploy the Docker containers
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Prune unused images to save space
            docker image prune -f
          EOF
