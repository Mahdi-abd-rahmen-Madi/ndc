version: '3.8'

services:
  db:
    # Aligned with production Postgres 16 + PostGIS 3.4
    image: postgis/postgis:16-3.4
    container_name: ndc_postgis
    environment:
      POSTGRES_USER: ndc_user
      POSTGRES_PASSWORD: ndc_password
      POSTGRES_DB: ndc_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
