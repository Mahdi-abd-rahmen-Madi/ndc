<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Note de Calculs - Equipement</title>
    <style>
        @page {
            size: A4;
            margin: 25mm 20mm 25mm 20mm;
            @top-left {
                content: element(header_logo);
            }
            @top-right {
                content: "Adresse : \A 90-92 route de la Reine \A 92100-Boulogne";
                white-space: pre;
                font-family: Arial, sans-serif;
                font-size: 8pt;
                text-align: right;
            }
            @bottom-center {
                content: counter(page);
                font-family: Arial, sans-serif;
                font-size: 10pt;
            }
        }

        body {
            font-family: 'Calibri', Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.4;
            color: #000;
        }

        .page-break {
            page-break-after: always;
        }

        /* Common Styles */
        h1 {
            color: #2F5597;
            text-align: center;
            font-style: italic;
            font-size: 24pt;
            margin-top: 10mm;
            margin-bottom: 10mm;
            font-weight: normal;
        }
        
        h2 {
            font-size: 14pt;
            font-weight: bold;
            color: #000;
            margin-top: 10mm;
            margin-bottom: 5mm;
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10mm;
        }

        th, td {
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-weight: bold;
            text-align: center;
        }
        
        .bg-green {
            background-color: #00AF50;
            color: black;
            text-align: center;
        }
        
        .header-logo {
            position: running(header_logo);
        }
        
        .header-logo img {
            max-width: 60mm;
            max-height: 15mm;
            object-fit: contain;
        }
        
        .text-center { text-align: center; }
        .text-bold { font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-logo">
        {% if logo_abs %}
            <img src="file://{{ logo_abs }}" alt="COMETA">
        {% else %}
            COMETA Conseil & Ingénierie
        {% endif %}
    </div>

    {% block content %}
    {% endblock %}
</body>
</html>
