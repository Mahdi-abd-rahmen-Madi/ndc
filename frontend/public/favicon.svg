<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="32" y1="12" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="32" y1="32" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Compass / Structure Circle Base -->
  <circle cx="32" cy="32" r="21" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="23.5" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Compass Dial Cardinal Ticks -->
  <line x1="32" y1="9" x2="32" y2="13" stroke="white" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="51" x2="32" y2="55" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
  <line x1="9" y1="32" x2="13" y2="32" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />
  <line x1="51" y1="32" x2="55" y2="32" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />

  <!-- Modern Dynamic Needles (Compass / Structural Diamond) -->
  <!-- North Point (Cyan-White Glowing) -->
  <polygon points="32,13 37.5,32 32,32" fill="url(#needleNorth)" filter="url(#glow)" />
  <polygon points="32,13 26.5,32 32,32" fill="#ffffff" filter="url(#glow)" />

  <!-- South Point (Violet-Indigo) -->
  <polygon points="32,51 37.5,32 32,32" fill="url(#needleSouth)" />
  <polygon points="32,51 26.5,32 32,32" fill="#4338ca" />

  <!-- Center Pivot / Hub -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" />
  <circle cx="32" cy="32" r="2" fill="#4f46e5" />
</svg>
