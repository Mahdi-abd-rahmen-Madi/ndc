services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ndc_postgis_prod
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ndc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ndc_password}
      POSTGRES_DB: ${POSTGRES_DB:-ndc_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ndc_user} -d ${POSTGRES_DB:-ndc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - ndc_network

  caddy:
    image: caddy:2-alpine
    container_name: ndc_caddy_prod
    ports:
      - "8008:8008"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/media:/srv/media:ro
      - ./backend/data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      ws-hub:
        condition: service_started
      frontend:
        condition: service_started
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - ndc_network

  ws-hub:
    build:
      context: ./ws-hub
      dockerfile: Dockerfile
    container_name: ndc_ws_hub_prod
    env_file:
      - .env
    environment:
      - LISTEN_ADDR=:8081
      - DATABASE_URL=postgres://${POSTGRES_USER:-ndc_user}:${POSTGRES_PASSWORD:-ndc_password}@db:5432/${POSTGRES_DB:-ndc_db}
      - WS_HUB_SECRET=${WS_HUB_SECRET:-change-me-ws-hub-secret}
      - ROBOT_WORKER_URL=${ROBOT_WORKER_URL:-${WORKER_BASE_URL:-http://100.97.172.27:8001}}
      - ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ndc.heliosys.io,http://localhost:5178}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - ndc_network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ndc_gotenberg_prod
    command: ["gotenberg", "--api-timeout=120s"]
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - ndc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - INSTALL_LIBREOFFICE=false
    container_name: ndc_backend_prod
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ndc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ndc_password}
      - POSTGRES_DB=${POSTGRES_DB:-ndc_db}
      - DATABASE_URL=postgis://${POSTGRES_USER:-ndc_user}:${POSTGRES_PASSWORD:-ndc_password}@db:5432/${POSTGRES_DB:-ndc_db}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api-ndc.heliosys.io,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ndc.heliosys.io,http://localhost:5178}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api-ndc.heliosys.io}
      - USE_DB_CACHE=true
      - DRF_DISABLE_THROTTLE=true
      - ASYNC_PDF_GENERATION=true
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - WS_HUB_URL=http://ws-hub:8081
      - WS_HUB_SECRET=${WS_HUB_SECRET:-change-me-ws-hub-secret}
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      ws-hub:
        condition: service_started
      gotenberg:
        condition: service_started
    mem_limit: 1536m
    restart: unless-stopped
    networks:
      - ndc_network

  qcluster:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - INSTALL_LIBREOFFICE=false
    container_name: ndc_qcluster_prod
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ndc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ndc_password}
      - POSTGRES_DB=${POSTGRES_DB:-ndc_db}
      - DATABASE_URL=postgis://${POSTGRES_USER:-ndc_user}:${POSTGRES_PASSWORD:-ndc_password}@db:5432/${POSTGRES_DB:-ndc_db}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api-ndc.heliosys.io}
      - USE_DB_CACHE=true
      - Q_CLUSTER_WORKERS=${Q_CLUSTER_WORKERS:-2}
      - Q_CLUSTER_POLL=${Q_CLUSTER_POLL:-1.5}
      - WS_HUB_URL=http://ws-hub:8081
      - WS_HUB_SECRET=${WS_HUB_SECRET:-change-me-ws-hub-secret}
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      ws-hub:
        condition: service_started
      gotenberg:
        condition: service_started
    mem_limit: 1536m
    restart: unless-stopped
    networks:
      - ndc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api-ndc.heliosys.io
    container_name: ndc_frontend_prod
    ports:
      - "5178:80"
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - ndc_network

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:

networks:
  ndc_network:
    driver: bridge
