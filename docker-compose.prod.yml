version: '3.8'

services:
  db:
    # Using Postgres 16 with PostGIS
    image: postgis/postgis:16-3.4
    container_name: ndc_postgis_prod
    environment:
      POSTGRES_USER: ndc_user
      POSTGRES_PASSWORD: ndc_password
      POSTGRES_DB: ndc_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ndc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndc_backend_prod
    env_file:
      - .env
    environment:
      - POSTGRES_USER=ndc_user
      - POSTGRES_PASSWORD=ndc_password
      - POSTGRES_DB=ndc_db
      - DATABASE_URL=postgis://ndc_user:ndc_password@db:5432/ndc_db
      # The production allowed hosts should be passed or managed in settings
      - ALLOWED_HOSTS=api-ndc.heliosys.io,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=https://ndc.heliosys.io,http://localhost:5178
    ports:
      - "8008:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - ndc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api-ndc.heliosys.io
        - VITE_WORKER_URL=https://api-ndc.heliosys.io
    container_name: ndc_frontend_prod
    ports:
      - "5178:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ndc_network

volumes:
  postgres_data_prod:

networks:
  ndc_network:
    driver: bridge
