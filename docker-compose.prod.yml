services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ndc_postgis_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ndc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ndc_password}
      POSTGRES_DB: ${POSTGRES_DB:-ndc_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ndc_user} -d ${POSTGRES_DB:-ndc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ndc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndc_backend_prod
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ndc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ndc_password}
      - POSTGRES_DB=${POSTGRES_DB:-ndc_db}
      - DATABASE_URL=postgis://${POSTGRES_USER:-ndc_user}:${POSTGRES_PASSWORD:-ndc_password}@db:5432/${POSTGRES_DB:-ndc_db}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api-ndc.heliosys.io,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ndc.heliosys.io,http://localhost:5178}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api-ndc.heliosys.io}
      - USE_DB_CACHE=true
    ports:
      - "8008:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ndc_network

  qcluster:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ndc_qcluster_prod
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ndc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ndc_password}
      - POSTGRES_DB=${POSTGRES_DB:-ndc_db}
      - DATABASE_URL=postgis://${POSTGRES_USER:-ndc_user}:${POSTGRES_PASSWORD:-ndc_password}@db:5432/${POSTGRES_DB:-ndc_db}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api-ndc.heliosys.io}
      - USE_DB_CACHE=true
      - Q_CLUSTER_WORKERS=${Q_CLUSTER_WORKERS:-2}
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - ndc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api-ndc.heliosys.io
    container_name: ndc_frontend_prod
    ports:
      - "5178:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ndc_network

volumes:
  postgres_data_prod:

networks:
  ndc_network:
    driver: bridge
